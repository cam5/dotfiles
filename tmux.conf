# General options
set -g default-terminal "screen-256color"
# tell Tmux that outside terminal supports true color
set -ga terminal-overrides ",xterm-256color*:Tc"

# Easy reload
bind r source-file ~/.tmux.conf \;

# Rebind tmux prefix to ctrl-a. (Better pos, when Caps-Lock is substituted for it on OS X)
set -g prefix 'C-a'

# Navigation keys
bind-key = next-window
bind-key - previous-window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing on the home row: C-<hjkl> grows the pane from that side,
# shift shrinks from it. The arrow-key version of this collided with system
# hotkeys, and ctrl+shift+<letter> is indistinguishable from ctrl+<letter>
# at the terminal, so shrink is plain shift instead.
#
# The helper exists because tmux's own resize-pane moves a border in an
# absolute direction rather than growing or shrinking *this* pane, which
# makes the same key grow in one pane and shrink in another -- see the
# comment at the top of the script. -r means one prefix, then tap freely.
#
# Window switching lives on = and - above, so C-h/C-l are free for this.
bind -r C-h run-shell "~/.tmux/scripts/pane-resize.sh '#{pane_id}' left  grow"
bind -r C-j run-shell "~/.tmux/scripts/pane-resize.sh '#{pane_id}' down  grow"
bind -r C-k run-shell "~/.tmux/scripts/pane-resize.sh '#{pane_id}' up    grow"
bind -r C-l run-shell "~/.tmux/scripts/pane-resize.sh '#{pane_id}' right grow"
bind -r H   run-shell "~/.tmux/scripts/pane-resize.sh '#{pane_id}' left  shrink"
bind -r J   run-shell "~/.tmux/scripts/pane-resize.sh '#{pane_id}' down  shrink"
bind -r K   run-shell "~/.tmux/scripts/pane-resize.sh '#{pane_id}' up    shrink"
bind -r L   run-shell "~/.tmux/scripts/pane-resize.sh '#{pane_id}' right shrink"

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g mouse on

# Copy to the system pasteboard on macOS. Modern tmux talks to pbcopy
# directly -- no reattach-to-user-namespace shim needed anymore.
setw       -g mode-keys vi
bind-key   -T copy-mode-vi v send-keys -X begin-selection
bind-key   -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key   -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
unbind-key -T copy-mode-vi Enter

set -g default-shell   $SHELL
set -g default-command "${SHELL}"

# Toggle the status bar
bind E run "tmux set status off"
bind e run "tmux set status on"

set-option        -sg escape-time 15
set-option        -g  repeat-time 750 # window for chaining -r resize taps
set-option        -g  base-index 1
set-option        -g  history-limit 50000
set-option        -g  focus-events on
set-option        -g  lock-command vlock
set-option        -g  set-titles on
set-option        -g  set-titles-string '[#{session_name}:#{window_name}] #{window_index}' # use screen title
set-window-option -g  xterm-keys on # to make ctrl-arrow, etc. work

# Status Options & Layout
set               -g base-index 1
setw              -g allow-rename off
setw              -g automatic-rename on
setw              -g automatic-rename-format '#(~/.tmux/scripts/pane-command.sh #{pane_pid} "#{pane_current_command}")'
set-option        -g status-justify left
setw -g window-status-format "#[dim] #W "
setw -g window-status-current-format "#[bg=cyan] #[fg=white, bold]#W #[fg=blue, bg=terminal]"


set -g status-left ''
set -g status-right '' # --bright didn't do it, so: sed!
set -g status-interval 5
set -g renumber-windows on

# COLORS.
set -g status-style 'bg=terminal fg=default'
set -g message-style 'bg=blue fg=yellow'

# Divider Colors
set -g pane-border-style 'fg=brightblack bg=terminal'
set -g pane-active-border-style 'fg=cyan bg=terminal'
set -g pane-border-lines simple

# Show the running command on each pane's border
set -g pane-border-status top
set -g pane-border-format ' #(~/.tmux/scripts/pane-command.sh #{pane_pid} "#{pane_current_command}") '

